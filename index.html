  .partial{background:var(--brand-highlight);color:var(--brand-highlight-foreground);}
  .zero{background:var(--destructive);color:var(--destructive-foreground);}
  .qans{font-size:.8rem;color:var(--muted-foreground);white-space:pre-line;margin-bottom:5px;}

<script>
const data = JSON.parse(document.getElementById('data').textContent);
const { maxTotal, generatedAt, students } = data;

document.getElementById('meta').textContent =
  `${students.length} students · out of ${maxTotal} marks · generated ${new Date(generatedAt).toLocaleString()}`;

const avg = students.reduce((a,s)=>a+s.total,0) / students.length;
const cards = [
  ['Class average', `${avg.toFixed(1)} / ${maxTotal}`],
  ['Top score', `${students[0].total} — ${students[0].name}`],
  ['Lowest score', `${students[students.length-1].total} — ${students[students.length-1].name}`],
];
document.getElementById('cards').innerHTML = cards.map(([l,n]) =>
  `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`
).join('');

function markClass(given, max){
  if (given >= max) return 'full';
  if (given <= 0) return 'zero';
  return 'partial';
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const board = document.getElementById('board');
board.innerHTML = students.map((s, i) => {
  const pct = Math.round((s.total / maxTotal) * 100);
  const qcards = s.answers.map(a => `
    <div class="qcard">
      <div class="qhead"><span>${a.q}</span><span class="qmark ${markClass(a.given,a.max)}">${a.given}/${a.max}</span></div>
      <div class="qans">${escapeHtml(a.answer || '(no answer)')}</div>
      <div class="qfb">${escapeHtml(a.feedback)}</div>
    </div>`).join('');
  return `
    <div>
      <div class="row" data-i="${i}" tabindex="0" role="button" aria-expanded="false">
        <div class="rank">${i+1}</div>
        <div class="name">${escapeHtml(s.name)}</div>
        <div class="barwrap"><div class="bar" style="width:${pct}%"></div></div>
        <div class="pct">${pct}%</div>
        <div class="score">${s.total}/${maxTotal}</div>
        <div class="chev">&#9656;</div>
      </div>
      <div class="detail" id="detail-${i}"><div class="qgrid">${qcards}</div></div>
    </div>`;
}).join('');

function toggle(row){
  const open = row.getAttribute('aria-expanded') === 'true';
  row.setAttribute('aria-expanded', String(!open));
  document.getElementById('detail-' + row.dataset.i).classList.toggle('open', !open);
}
board.querySelectorAll('.row').forEach(row => {
  row.addEventListener('click', () => toggle(row));
  row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(row); } });
});
</script>
